[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenization-awareness"
version = "1.0.0"
description = "A layer-0 transcoder feature in Qwen3-4B that fires on compounds with unstable tokenization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ekaterina Matson" }]
keywords = [
    "mechanistic-interpretability",
    "tokenization",
    "transcoders",
    "qwen",
    "detokenization",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "transformers>=4.51.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "wordfreq>=3.0",
]

[project.optional-dependencies]
# Everything needed to actually run the model. Split out so the dataset and
# analysis stages stay installable on a laptop.
model = [
    "torch>=2.1",
    "transformer-lens>=2.0",
    "safetensors>=0.4",
    "huggingface-hub>=0.20",
]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Write-up = "https://medium.com/@solidgoldmagikarp/a-breakthrough-feature-signs-of-tokenization-awareness-in-llms-058fe880ef9f"
Feature = "https://www.neuronpedia.org/qwen3-4b/0-transcoder-hp/118230"

[tool.setuptools.packages.find]
include = ["tokenization_awareness*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the Qwen tokenizer downloaded from the Hub"]
